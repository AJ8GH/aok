plugins {
  alias libs.plugins.kotlin.jvm
  alias libs.plugins.kover
  alias libs.plugins.java.test.fixtures
}

allprojects {
  apply plugin: libs.plugins.kotlin.jvm.get().pluginId
  apply plugin: libs.plugins.kover.get().pluginId
  apply plugin: libs.plugins.java.test.fixtures.get().pluginId

  group = groupId
  version = projectVersion

  repositories {
    mavenLocal()
    mavenCentral()
  }

  test {
    useJUnitPlatform()
    finalizedBy(
        koverXmlReport,
        koverHtmlReport,
    )
  }

  kotlin {
    jvmToolchain(libs.versions.java.get().toInteger())
  }
}

subprojects {
  dependencies {
    implementation libs.bundles.implementation
    testImplementation libs.bundles.test.implementation
  }
}

configure(subprojects.findAll { it.name != util.substring(1) }) {
  dependencies {
    testImplementation(testFixtures(project(util)))
    implementation project(util)
  }
}

configure(subprojects.findAll { it.name == util.substring(1) }) {
  dependencies {
    testFixturesImplementation libs.bundles.test.implementation
  }
}

dependencies {
  kover(project(util))
  kover(project(y15))
  kover(project(y20))
  kover(project(y23))
  kover(project(y24))
  kover(project(y25))
}
